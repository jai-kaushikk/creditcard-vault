name: Test and build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app-checks:
    name: App · typecheck, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src plugins
      - run: npm test

  server-checks:
    name: Server · typecheck, tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cardvault_test

  apk:
    name: Build Android APK
    needs: [app-checks, server-checks]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_API_URL: ${{ vars.CARDVAULT_API_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Use your release keystore if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the standard debug keystore (SHA-1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25)."
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          CV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="CardVault-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$NAME"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
      - name: Publish a GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SET: ${{ vars.GOOGLE_WEB_CLIENT_ID != '' }}
          SERVER_SET: ${{ vars.CARDVAULT_API_URL != '' }}
        run: |
          TAG="apk-${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          NOTES=$(cat <<EOF
          Android APK built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.

          **Install:** download \`${{ steps.apk.outputs.name }}\` below on your Android phone and open it (allow "Install unknown apps" for your browser when asked).

          - Google sign-in configured in this build: ${GOOGLE_SET}
          - CardVault server configured in this build: ${SERVER_SET}

          Without them the app runs offline on one phone, with demo data to look around. See the README for setup.
          EOF
          )
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CardVault ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$NOTES" \
            --latest
