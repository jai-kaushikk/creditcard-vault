plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.cardvault'
version = '0.1.0'

android {
  namespace "expo.modules.cardnfc"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
  }
}

dependencies {
  // EMV contactless reader (Apache 2.0): selects the payment app on the chip and reads its records.
  implementation 'com.github.devnied.emvnfccard:library:3.2.0'
  implementation 'org.slf4j:slf4j-api:1.7.36'
}
