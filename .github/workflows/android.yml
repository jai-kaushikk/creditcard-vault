name: Test and build APK

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Not secrets: identifiers from the one-time GCP setup (README → Deploy the server).
  GCP_PROJECT_ID: project-1ca83d7c-09d0-46ec-800
  GCP_REGION: asia-south1
  GCP_WORKLOAD_IDENTITY_PROVIDER: projects/420358690991/locations/global/workloadIdentityPools/github/providers/github
  GCP_SERVICE_ACCOUNT: cardvault-deployer@project-1ca83d7c-09d0-46ec-800.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT: cardvault-runtime@project-1ca83d7c-09d0-46ec-800.iam.gserviceaccount.com
  CLOUDSQL_CONNECTION: project-1ca83d7c-09d0-46ec-800:asia-south1:cardvault-db

jobs:
  app-checks:
    name: App · typecheck, lint, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint src plugins
      - run: npm test

  server-checks:
    name: Server · typecheck, tests on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cardvault_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cardvault_test

  deploy-server:
    name: Deploy server to Cloud Run
    needs: [app-checks, server-checks]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # lets GitHub prove to GCP who it is; no keys stored anywhere
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Export the web app
        working-directory: app
        env:
          # No API URL: the web app calls the server it's served from.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '420358690991-6d927rva07c59bttov8ciutl3i3hgdg4.apps.googleusercontent.com' }}
        run: |
          npm ci
          npx expo export --platform web
          cp -R dist/. ../server/web/
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Build and push the server image
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/cardvault/server:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" server
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
      - name: Deploy
        id: deploy
        run: |
          # Scales to zero when idle and caps at 2 instances, so the free tier covers it.
          gcloud run deploy cardvault-api \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --image "$IMAGE" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --add-cloudsql-instances "$CLOUDSQL_CONNECTION" \
            --set-secrets "DATABASE_URL=cardvault-database-url:latest,SESSION_SECRET=cardvault-session-secret:latest" \
            --set-env-vars "GOOGLE_WEB_CLIENT_ID=${{ vars.GOOGLE_WEB_CLIENT_ID || '420358690991-6d927rva07c59bttov8ciutl3i3hgdg4.apps.googleusercontent.com' }}" \
            --cpu 1 --memory 512Mi --min-instances 0 --max-instances 2 --concurrency 80 \
            --no-invoker-iam-check --quiet
          URL=$(gcloud run services describe cardvault-api --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          curl -fsS --retry 5 --retry-all-errors "$URL/health"
          curl -fsS "$URL/" | grep -q 'id="root"'
          echo "Deployed $URL" >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: Build Android APK
    needs: [app-checks, server-checks, deploy-server]
    # Runs whether or not the server deploy was skipped, but not if it failed.
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.app-checks.result == 'success' && needs.server-checks.result == 'success' &&
      needs.deploy-server.result != 'failure' && needs.deploy-server.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    env:
      CI: 1
      # Repository variables (Settings → Secrets and variables → Actions → Variables).
      # The Google web client ID is public (it ships in the APK); a repository variable overrides it.
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID || '420358690991-6d927rva07c59bttov8ciutl3i3hgdg4.apps.googleusercontent.com' }}
      EXPO_PUBLIC_API_URL: ${{ needs.deploy-server.outputs.url || vars.CARDVAULT_API_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Use your release keystore if one is configured
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "CV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release keystore from secrets."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with the standard debug keystore (SHA-1 5E:8F:16:06:2E:A3:CD:2C:4A:0D:54:78:76:BA:A6:F3:8C:AB:F6:25)."
          fi
      - name: Build release APK
        working-directory: app/android
        env:
          CV_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          CV_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          CV_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
      - name: Name the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          NAME="CardVault-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "path=$RUNNER_TEMP/$NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$RUNNER_TEMP/$NAME"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30
      - name: Publish a GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_SET: 'true'
          SERVER_SET: ${{ (needs.deploy-server.outputs.url || vars.CARDVAULT_API_URL) != '' }}
        run: |
          TAG="apk-${{ steps.apk.outputs.version }}-build${{ github.run_number }}"
          NOTES=$(cat <<EOF
          Android APK built from \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`.

          **Install:** download \`${{ steps.apk.outputs.name }}\` below on your Android phone and open it (allow "Install unknown apps" for your browser when asked).

          - Google sign-in configured in this build: ${GOOGLE_SET}
          - CardVault server configured in this build: ${SERVER_SET}

          Without them the app runs offline on one phone, with demo data to look around. See the README for setup.
          EOF
          )
          gh release create "$TAG" "${{ steps.apk.outputs.path }}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CardVault ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})" \
            --notes "$NOTES" \
            --latest
