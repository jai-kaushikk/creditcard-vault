<!-- @dsCard group="Screens" height=860 width=1580 page subtitle="Vault · Share card · OTP request · Ledger" -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CardVault — mobile screens</title>
<style>
  .screens { display: flex; gap: var(--space-6); padding: var(--space-6); align-items: flex-start; }
  .shot { display: flex; flex-direction: column; gap: var(--space-3); }
  .shot-label { font-size: 13px; line-height: 18px; font-weight: 600; color: var(--ink-muted); }
  .phone { position: relative; width: 360px; height: 760px; border-radius: 40px; border: 1px solid var(--line-strong); background: var(--surface); overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; }
  .status { display: flex; justify-content: space-between; padding: 14px 24px 6px; font-size: 13px; line-height: 18px; font-weight: 600; }
  .scroll { flex: 1; overflow: hidden; padding: 0 var(--space-4) var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); }
  .top { display: flex; justify-content: space-between; align-items: center; padding-top: var(--space-2); }
  .h-display { margin: 0; font-size: 32px; line-height: 38px; font-weight: 700; letter-spacing: -.01em; }
  .h-title { margin: 0; font-size: 20px; line-height: 26px; font-weight: 600; }
  .muted { color: var(--ink-muted); font-size: 13px; line-height: 18px; font-weight: 500; }
  .lock { display: inline-flex; gap: var(--space-1); align-items: center; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--vault); padding: 6px var(--space-3); border-radius: var(--radius-pill); }
  .float-tabs { position: absolute; left: var(--space-4); right: var(--space-4); bottom: 20px; }
  .scroll.has-tabs { padding-bottom: 104px; }
  .lock svg { width: 14px; height: 14px; }
  .summary { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
  .sum { background: var(--surface-raised); border-radius: var(--radius-md); padding: var(--space-3) var(--space-4); }
  .sum .muted { display: block; }
  .stack { position: relative; height: 282px; }
  .scroll > * { flex: none; }
  .stack .cv-card { position: absolute; left: 0; }
  .section-h { display: flex; justify-content: space-between; align-items: baseline; }
  .section-h b { font-size: 17px; line-height: 24px; }
  .link { color: var(--vault); font-size: 13px; font-weight: 600; }
  .chips { display: flex; gap: var(--space-2); flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: var(--space-2); padding: 4px var(--space-3) 4px 4px; border-radius: var(--radius-pill); border: 1px solid var(--line-strong); background: var(--surface-raised); font-size: 13px; line-height: 18px; font-weight: 600; }
  .chip.on { border-color: var(--vault); background: var(--vault-soft); color: var(--vault); box-shadow: inset 0 0 0 1px var(--vault); }
  .group { background: var(--surface-raised); border-radius: var(--radius-md); }
  .setting { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--line); }
  .setting:last-child { border-bottom: 0; }
  .setting b { display: block; font-size: 15px; line-height: 22px; font-weight: 600; }
  .val { font-size: 15px; font-weight: 600; white-space: nowrap; }
  .toggle { width: 44px; height: 26px; border-radius: var(--radius-pill); background: var(--vault); position: relative; flex: none; }
  .toggle::after { content: ''; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: var(--radius-pill); background: var(--on-vault); }
  .toggle.off { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .toggle.off::after { left: 3px; right: auto; background: var(--line-strong); }
  .note { font-size: 13px; line-height: 18px; color: var(--ink-muted); margin: 0; }
  .footer { padding: var(--space-3) var(--space-4) var(--space-5); background: var(--surface); }
  .dim { position: absolute; inset: 0; background: var(--scrim); }
  .sheet-wrap { position: absolute; left: 0; right: 0; bottom: 0; }
  .ghost { opacity: 1; }
  .ledger-head { background: var(--surface-raised); border-radius: var(--radius-md); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }
  .ledger-head .row { display: flex; gap: var(--space-3); align-items: center; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .day { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); margin: 0 0 calc(-1 * var(--space-2)); }
</style>
</head>
<body>
<div id="root"></div>
<script>
  var C = window.CardVault, h = React.createElement;
  function lockIcon() { return h('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', 'aria-hidden': true }, h('path', { d: 'M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z' })); }
  function Phone(props) {
    return h('div', { className: 'shot' },
      h('div', { className: 'shot-label' }, props.label),
      h('div', { className: 'phone' },
        h('div', { className: 'status' }, h('span', null, '9:41'), h('span', null, '5G  86%')),

  function Tabs(props) { return h(C.TabBar, { active: props.on, className: 'float-tabs' }); }

  var vault = h(Phone, { label: '1 · Vault (home)' },

      h('div', { className: 'section-h' }, h('b', null, 'My cards · 3'), h('span', { className: 'link' }, 'Add card')),
      h('div', { className: 'stack' },
        h(C.CreditCard, { nickname: 'SBI Cashback', network: 'rupay', last4: '5512', expiry: '11/27', face: 'brass', className: 'ghost', compact: false }),
        h('div', { style: { position: 'absolute', top: 36, left: 0 } }, h(C.CreditCard, { nickname: 'Amazon Pay ICICI', network: 'visa', last4: '0937', expiry: '02/28', face: 'jade' })),
        h('div', { style: { position: 'absolute', top: 72, left: 0 } }, h(C.CreditCard, { nickname: 'HDFC Millennia', network: 'visa', last4: '4821', holder: 'Aarav Mehta', expiry: '08/29', face: 'onyx', sharedWith: 'Rahul' }))),
      h('div', { className: 'section-h' }, h('b', null, 'Friends'), h('span', { className: 'link' }, 'See all')),
      h(C.BalanceCard, { name: 'Rahul Verma', netMinor: 315000 }),
      h(C.BalanceCard, { name: 'Priya Nair', netMinor: -120000 })),
    h(Tabs, { on: 'vault' }));

  var share = h(Phone, { label: '2 · Share a card' },
    h('div', { className: 'scroll' },
      h('div', { className: 'top' }, h('span', { className: 'link' }, 'Cancel'), h('span', { className: 'muted' }, 'Step 2 of 2'), h('span', { style: { width: 44 } })),
      h('h1', { className: 'h-title' }, 'Share HDFC Millennia'),
      h(C.CreditCard, { nickname: 'HDFC Millennia', network: 'visa', last4: '4821', expiry: '08/29', face: 'onyx', compact: true }),
      h('div', null, h('div', { className: 'muted', style: { marginBottom: 8 } }, 'With'),
        h('div', { className: 'chips' },
          h('span', { className: 'chip on' }, h(C.Avatar, { name: 'Rahul Verma', size: 28 }), 'Rahul'),
          h('span', { className: 'chip' }, h(C.Avatar, { name: 'Priya Nair', size: 28 }), 'Priya'),
          h('span', { className: 'chip' }, h(C.Avatar, { name: 'Kabir Shah', size: 28 }), 'Kabir'))),
      h('div', { className: 'group' },
        h('div', { className: 'setting' }, h('div', null, h('b', null, 'Ask me for every OTP'), h('span', { className: 'muted' }, 'Always on — you approve each payment')), h('span', { className: 'toggle', 'aria-label': 'On' })),
        h('div', { className: 'setting' }, h('div', null, h('b', null, 'Limit per payment'), h('span', { className: 'muted' }, 'Requests above this are blocked')), h('span', { className: 'val' }, '₹5,000')),
        h('div', { className: 'setting' }, h('div', null, h('b', null, 'Access ends'), h('span', { className: 'muted' }, 'Rahul’s copy is wiped then')), h('span', { className: 'val' }, '31 Oct')),
        h('div', { className: 'setting' }, h('div', null, h('b', null, 'Include CVV'), h('span', { className: 'muted' }, 'Needed for most online checkouts')), h('span', { className: 'toggle off', 'aria-label': 'Off' }))),
      h('p', { className: 'note' }, 'Card details are encrypted on your phone to Rahul’s phone. CardVault’s servers relay them once and never store them.')),
    h('div', { className: 'footer' }, h(C.Button, { variant: 'primary', block: true }, 'Share with Rahul')));

  var otp = h(Phone, { label: '3 · OTP request (owner’s phone)' },
    h('div', { className: 'scroll' },
      h('div', { className: 'top' }, h('h1', { className: 'h-display' }, 'Vault'), h('span', { className: 'lock cv-glass' }, lockIcon(), 'Face ID')),
      h(C.CreditCard, { nickname: 'HDFC Millennia', network: 'visa', last4: '4821', expiry: '08/29', face: 'onyx', sharedWith: 'Rahul' })),
    h('div', { className: 'dim' }),
    h('div', { className: 'sheet-wrap' }, h(C.OtpShareSheet, { state: 'request', requester: 'Rahul', merchant: 'Amazon', minor: 240000, cardName: 'HDFC Millennia', cardLast4: '4821', otp: '482913', expiresIn: 161 })));

  var ledger = h(Phone, { label: '4 · Ledger with a friend' },
    h('div', { className: 'scroll has-tabs' },
      h('div', { className: 'top' }, h(C.Button, { variant: 'glass', size: 'sm' }, '‹ Friends'), h('span'), h('span')),
      h('div', { className: 'ledger-head' },
        h('div', { className: 'row' }, h(C.Avatar, { name: 'Rahul Verma', size: 44 }), h('div', null, h('b', null, 'Rahul Verma'), h('div', { className: 'muted' }, '6 transactions · since Aug'))),
        h('div', null, h('div', { className: 'muted' }, 'Rahul owes you'), h(C.AmountText, { minor: 315000, direction: 'lent', size: 'lg', signed: false })),
        h('div', { className: 'btns' }, h(C.Button, { size: 'sm', variant: 'primary' }, 'Mark as paid'), h(C.Button, { size: 'sm' }, 'Remind'))),
      h('p', { className: 'day' }, 'This week'),
      h('div', { className: 'cv-ledger', role: 'list' },
        h(C.LedgerRow, { name: 'Rahul', merchant: 'Amazon', cardLast4: '4821', minor: 240000, direction: 'lent', status: 'pending', time: 'Today, 9:41 PM' }),
        h(C.LedgerRow, { name: 'Rahul', merchant: 'Swiggy', cardLast4: '4821', minor: 75000, direction: 'lent', status: 'confirmed', time: 'Sat, 8:02 PM' })),
      h('p', { className: 'day' }, 'Earlier'),
      h('div', { className: 'cv-ledger', role: 'list' },
        h(C.LedgerRow, { name: 'Rahul', merchant: 'Myntra', cardLast4: '7720', minor: 120000, direction: 'owe', status: 'confirmed', time: '12 Oct · his card' }),
        h(C.LedgerRow, { name: 'Rahul', merchant: 'Flipkart', cardLast4: '4821', minor: 360000, direction: 'lent', status: 'confirmed', time: '9 Oct' }))),
    h(Tabs, { on: 'ledger' }));

  ReactDOM.createRoot(document.getElementById('root')).render(h('div', { className: 'screens' }, vault, share, otp, ledger));
</script>
</body>
</html>
